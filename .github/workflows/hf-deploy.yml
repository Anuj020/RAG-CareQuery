name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - master
    paths:
      - "src/app.py"
      - "src/rag_retriever.py"
      - "src/data_ingested.py"
      - "README.MD"
      - "requirements.txt"
      - "src/main.py"
      - "src/vectors.py"
      - "src/embedding.py"
      - ".github/workflows/hf-deploy.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Hugging Face Hub
      run: pip install huggingface_hub

    - name: Upload to Hugging Face Space (Python API)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python - << 'EOF'
        from huggingface_hub import HfApi

        api = HfApi()
        api.upload_folder(
            folder_path=".",                      # upload entire repo
            repo_id="Anuj020/CareQuery",         # <username>/<space>
            repo_type="space",                   # must be "space"
            commit_message="Auto-deploy from GitHub",
            ignore_patterns=[
                "data/**",
                "s3_data/**",
                "*.ipynb",
                "__pycache__/**",
                ".git/**",
                ".github/**"
            ]
        )
        EOF
